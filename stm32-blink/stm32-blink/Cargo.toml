[package]
name = "stm32-blink"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
stm32f4xx-hal = { version = "=0.23.0", features = ["stm32f446"] }

[profile.dev]
opt-level = 1
debug = 2
panic = "abort"

[profile.release]
opt-level = "s"
debug = 2
lto = true
codegen-units = 1
panic = "abort"
